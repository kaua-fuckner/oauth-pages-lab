<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório OAuth</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <h1>Laboratório de Login</h1>

  <p>Faça login utilizando uma das opções abaixo:</p>

  <div class="login-buttons">
    <a href="/oauth/login/google">Entrar com Google</a>
    <a href="/oauth/login/github">Entrar com GitHub</a>
  </div>

  <p id="status">Verificando sessão...</p>

  <form class="logout-form" method="post" action="/oauth/logout">
    <button type="submit">Sair</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
