
name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o repositorio
        uses: actions/checkout@v4

      - name: Procura segredos versionados
        shell: bash
        run: |
          if git grep -nE "GOCSPX-|client_secret[[:space:]]*=[[:space:]]*['\"][^'\"]+" -- . \
            ':!*.md' \
            ':!.github/workflows/ci.yml'; then
            echo "::error::Possivel segredo encontrado no repositorio."
            exit 1
          fi

      - name: Instala SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Valida migracoes SQL
        shell: bash
        run: |
          set -euo pipefail

          test -n "$(find migrations -maxdepth 1 -name '*.sql' -print -quit)"

          for f in migrations/*.sql; do
            echo "Aplicando migracao: $f"
            sqlite3 -bail teste.db < "$f"
          done

          echo "Tabelas criadas:"
          sqlite3 teste.db ".tables"

      - name: Valida HTML
        run: npx --yes htmlhint "public/**/*.html"
